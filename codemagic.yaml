# Codemagic — ArkNet iOS 最简 Debug 工作流（免费版，零签名配置）
#
# 不需要任何 Apple 凭据 / 环境变量组：
#   Go + sagernet-gomobile → sing-box 1.13.0 libbox → ArkNet.xcframework
#   → XcodeGen 生成工程 → xcodebuild 无签名编译 → 未签名 debug IPA
#
# 注意：CODE_SIGNING_ALLOWED=NO 产出的 IPA 仅用于 CI 编译验证，
# 真机安装需在后续接入签名（use-profiles + API Key，见 README）。

workflows:
  arknet-ios-debug:
    name: ArkNet iOS Debug
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: 安装工具链 (Go / sagernet-gomobile / XcodeGen)
        script: |
          set -euo pipefail
          brew install go xcodegen
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          gomobile init

      - name: 构建 ArkNet.xcframework (sing-box 1.13.0 libbox + bridge)
        script: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p ios/Frameworks
          cd engine
          gomobile bind \
            -target=ios \
            -iosversion 16.0 \
            -bundleid com.at.arknetprod2.ios.framework \
            -o ../ios/Frameworks/ArkNet.xcframework \
            ./bridge
          cd ..
          ls -la ios/Frameworks/ArkNet.xcframework

      - name: 生成工程并编译 (无签名, Debug, 真机 SDK)
        script: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project ArkNet.xcodeproj \
            -scheme ArkNet \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包未签名 debug IPA
        script: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 \
                -path '*iphoneos*/ArkNet.app' | head -1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr ArkNet-debug-unsigned.ipa Payload
          rm -rf Payload

    artifacts:
      - build/DerivedData/Build/Products/**/*.app
      - "*.ipa"
