# Codemagic — ArkNet iOS 最简 Debug 工作流（免费版，零签名配置）
#
# 构建思路与 Android 端 libarknet.so 完全一致：在 sing-box 源码树内新增
# 一个 gomobile 包（engine/arknet），与 experimental/libbox 一起 bind。
# 这样 gomobile/gobind 的模块解析走 sing-box 自己的 go.mod（已 require
# sagernet/gomobile 且 go.sum 完整），避免独立模块里
# "unable to import bind: no Go package" 的失败。
#
# 产出：ArkNet.xcframework（Libbox* + Arknet* 类前缀）+ 未签名 debug IPA。
# 未签名 IPA 仅供 CI 编译验证，真机安装需接入签名（见 README）。

workflows:
  arknet-ios-debug:
    name: ArkNet iOS Debug
    max_build_duration: 90

    environment:
      xcode: latest
      vars:
        SING_BOX_VERSION: v1.13.0
        GOMODILE_VERSION: v0.1.13

    scripts:
      - name: 安装工具链 (Go / sagernet-gomobile / XcodeGen)
        script: |
          set -euo pipefail
          brew install go xcodegen
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install "github.com/sagernet/gomobile/cmd/gomobile@${GOMODILE_VERSION}"
          go install "github.com/sagernet/gomobile/cmd/gobind@${GOMODILE_VERSION}"
          gomobile init
          go version && gomobile version

      - name: 准备 sing-box 源码树并注入 arknet 包
        script: |
          set -euo pipefail
          rm -rf sing-box-src
          git clone --depth 1 --branch "$SING_BOX_VERSION" \
            https://github.com/SagerNet/sing-box sing-box-src
          mkdir -p sing-box-src/experimental/arknet
          cp engine/arknet/arknet.go sing-box-src/experimental/arknet/
          cd sing-box-src
          # 与 Android libarknet.so 内嵌的 gomobile 版本对齐
          go get "github.com/sagernet/gomobile@${GOMODILE_VERSION}"
          go list -m github.com/sagernet/gomobile github.com/sagernet/sing-box

      - name: 构建 ArkNet.xcframework (libbox + arknet)
        script: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          export GOTOOLCHAIN=local
          mkdir -p "$CM_BUILD_DIR/ios/Frameworks"
          cd sing-box-src
          # 官方 build_libbox 的 apple 编译标签（cmd/internal/build_libbox）
          TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,badlinkname,tfogo_checklinkname0,with_tailscale,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird,with_dhcp,grpcnotrace"
          gomobile bind -v \
            -target ios,iossimulator \
            -o "$CM_BUILD_DIR/ios/Frameworks/ArkNet.xcframework" \
            -tags-not-macos=with_low_memory \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=1.13.0 -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" \
            -tags "$TAGS" \
            ./experimental/arknet
          ls -la "$CM_BUILD_DIR/ios/Frameworks/ArkNet.xcframework"

      - name: 打印生成的协议签名 (签名不符时用于定位)
        script: |
          set -euo pipefail
          HEADER=$(find ios/Frameworks/ArkNet.xcframework -name "ArkNet.h" | head -1)
          echo "header: $HEADER"
          for proto in LibboxPlatformInterfaceProtocol LibboxCommandServerHandlerProtocol \
                       LibboxCommandClientHandlerProtocol LibboxInterfaceUpdateListenerProtocol \
                       LibboxTunOptionsProtocol LibboxNetworkInterfaceIteratorProtocol \
                       LibboxStringIteratorProtocol LibboxLogIteratorProtocol \
                       LibboxOutboundGroupIteratorProtocol; do
            echo "----- $proto -----"
            awk "/@protocol $proto/,/@end/" "$HEADER" || true
          done
          echo "----- Arknet* symbols -----"
          grep -n "Arknet" "$HEADER" | head -30 || true

      - name: 生成工程并编译 (无签名, Debug)
        script: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project ArkNet.xcodeproj \
            -scheme ArkNet \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包未签名 debug IPA
        script: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 \
                -path '*iphoneos*/ArkNet.app' | head -1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr ArkNet-debug-unsigned.ipa Payload
          rm -rf Payload

    artifacts:
      - build/DerivedData/Build/Products/**/*.app
      - "*.ipa"
      - ios/Frameworks/ArkNet.xcframework
