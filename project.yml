name: ArkNet
options:
  bundleIdPrefix: com.at.arknetprod2
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ArkNet:
    type: application
    platform: iOS
    sources:
      - path: ios/App
      - path: ios/Shared
      - path: ios/Resources
        buildPhase: resources
    dependencies:
      - target: ArkNetTunnel
      # gomobile 产出的是静态 framework：链接，不要 embed
      - framework: ios/Frameworks/ArkNet.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.at.arknetprod2.ios
        PRODUCT_NAME: ArkNet
        INFOPLIST_FILE: ios/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/App/ArkNet.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  ArkNetTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Tunnel
      - path: ios/Shared
    dependencies:
      - framework: ios/Frameworks/ArkNet.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.at.arknetprod2.ios.tunnel
        PRODUCT_NAME: ArkNetTunnel
        INFOPLIST_FILE: ios/Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/Tunnel/ArkNetTunnel.entitlements
        # 扩展必须以 YES 构建，否则链接期报
        # "Application extensions ... must be built with APPLICATION_EXTENSION_API_ONLY = YES"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  ArkNet:
    build:
      targets:
        ArkNet: all
        ArkNetTunnel: all
    run:
      config: Debug
    archive:
      config: Release
